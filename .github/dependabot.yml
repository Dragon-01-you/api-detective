version: 2
updates:
  # Python 依赖安全更新（运行时依赖 + 可选推理栈，同一 pip 目录只能有一个配置项）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # 零散补丁版本合并成一个 PR，减少噪音
      patch-updates:
        applies-to: version-updates
        update-types:
          - "patch"
      # 可选推理栈（torch / transformers 等）体量大、升级风险高，单独成组
      llmmap-stack:
        applies-to: version-updates
        patterns:
          - "torch"
          - "transformers"
          - "accelerate"
          - "scipy"
          - "numpy"

  # GitHub Actions 版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
